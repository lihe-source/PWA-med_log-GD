<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>MedLog 通知金鑰設定</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101816;color:#e4eee9}*{box-sizing:border-box}body{max-width:720px;margin:auto;padding:30px 18px 60px}h1{font-size:26px}p{line-height:1.8;color:#afc0b6}label{display:block;font-weight:650;margin-top:22px}textarea{display:block;margin:10px 0;width:100%;min-height:95px;background:#1c2922;color:#e4eee9;border:1px solid #40544a;border-radius:10px;padding:12px;font-size:16px;overflow-wrap:anywhere}button{min-height:46px;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:650;background:#42c9aa;color:#102019;cursor:pointer}.secondary{background:#263c30;color:#e4eee9}#status{min-height:30px;color:#42c9aa}.note{padding:14px;background:#1c2922;border-radius:12px;font-size:14px}
</style></head><body><h1>MedLog 通知金鑰設定</h1><p>按下產生後，將公鑰與私鑰分別貼入 Cloudflare Worker 設定。所有計算只在目前瀏覽器執行，本頁不傳送資料，也不儲存金鑰。</p><button id="generate">產生 VAPID 公私鑰</button><p class="note">初次設定產生一組即可。已使用中的公鑰若改變，各裝置需要重新啟用通知。請自行保留這組金鑰；私鑰只貼入 Worker 的 Secret。</p><label for="public">VAPID_PUBLIC_KEY（公鑰）</label><textarea id="public" readonly spellcheck="false" autocomplete="off"></textarea><button class="secondary" data-copy="public">複製公鑰</button><label for="private">VAPID_PRIVATE_KEY（私鑰）</label><textarea id="private" readonly spellcheck="false" autocomplete="off"></textarea><button class="secondary" data-copy="private">複製私鑰</button><p id="status" role="status"></p><p>VAPID_SUBJECT 請另外填入 <strong>mailto:你的實際電子郵件</strong>。完整設定步驟請見 NOTIFICATIONS.md。</p><script>
const $=id=>document.getElementById(id),encode=buffer=>{let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');};
$('generate').onclick=async()=>{try{if(!crypto.subtle)throw new Error('請透過 GitHub Pages 的 HTTPS 網址開啟本頁。');const keys=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);$('public').value=encode(await crypto.subtle.exportKey('raw',keys.publicKey));$('private').value=(await crypto.subtle.exportKey('jwk',keys.privateKey)).d;$('status').textContent='已產生，請複製到 Worker 設定並自行保存。';}catch(e){$('status').textContent=e.message;}};
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const field=$(b.dataset.copy);if(!field.value){$('status').textContent='請先產生金鑰。';return;}try{await navigator.clipboard.writeText(field.value);$('status').textContent='已複製。';}catch{field.focus();field.select();$('status').textContent='請長按或使用系統複製功能。';}});
</script></body></html>
