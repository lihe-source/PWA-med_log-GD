<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="以月曆記錄每一天的藥品、保健食品與保養品，支援離線及 Google Drive 備份。">
  <title>MedLog 服藥日誌</title>
  <script>document.documentElement.dataset.standalone=String(Boolean(navigator.standalone||window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches));</script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="viewport-probe" aria-hidden="true"></div>
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="MedLog 首頁"><img src="./favicon.svg" alt="" width="42" height="42"><span>MedLog<small>服藥日誌</small></span></a>
    <div class="nav-caption">日常照顧</div>
    <nav class="desktop-nav" aria-label="主要頁面"></nav>
    <div class="sidebar-foot"><span class="small-tag">LOCAL FIRST</span><p>每一天，清楚記錄。</p><span>V<span class="version">1.4.0</span></span></div>
  </aside>
  <div class="app-shell">
    <header class="app-header">
      <div class="mobile-brand"><img src="./favicon.svg" alt="" width="32" height="32"><strong>MedLog</strong></div>
      <div class="header-context">個人照顧記錄</div>
      <div class="header-right"><span id="global-status" class="status-pill" role="status">正在讀取</span><span class="version-badge">V<span class="version">1.4.0</span></span></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading-state">正在讀取本機資料…</div></main>
    <nav class="bottom-nav" aria-label="主要頁面"></nav>
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <dialog id="photo-modal" aria-labelledby="photo-title"></dialog>
  <input id="import-file" class="visually-hidden" type="file" accept=".json,application/json" aria-label="選取 MedLog 備份檔">
  <noscript>MedLog 需要啟用 JavaScript 才能使用。</noscript>
</body>
</html>
